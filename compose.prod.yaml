# One file for BOTH environments (UAT and production). Differences live in .env.
# Run:  docker compose -f compose.prod.yaml up -d --build
# Optional services: set COMPOSE_PROFILES=worker,scheduler in .env

x-app-common: &app-common
  image: "${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME in .env}-app:latest"
  env_file: .env
  restart: unless-stopped
  volumes:
    - app-storage:/var/www/html/storage
  networks:
    - internal

services:
  app:
    <<: *app-common
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
      target: app
    mem_limit: 512m
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep php-fpm > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
      target: web
    image: "${COMPOSE_PROJECT_NAME}-web:latest"
    restart: unless-stopped
    ports:
      # localhost only: the host Nginx forwards traffic here
      - "127.0.0.1:${APP_PORT:?set APP_PORT in .env}:8080"
    volumes:
      - app-storage:/var/www/html/storage:ro
    networks:
      - internal
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    # No "ports:" on purpose: reachable only from other containers
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    command: ["--innodb-buffer-pool-size=${MYSQL_BUFFER_POOL:-256M}"]
    mem_limit: 768m
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No "ports:" on purpose; password required
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Optional: enable with COMPOSE_PROFILES=worker ----
  queue:
    <<: *app-common
    profiles: ["worker"]
    pull_policy: never          # uses the image built by the "app" service
    user: www-data
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90", "--sleep=3", "--max-time=3600"]
    mem_limit: 256m
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---- Optional: enable with COMPOSE_PROFILES=scheduler ----
  scheduler:
    <<: *app-common
    profiles: ["scheduler"]
    pull_policy: never
    user: www-data
    command: ["php", "artisan", "schedule:work"]
    mem_limit: 256m
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  internal:
    driver: bridge

volumes:
  app-storage:
  mysql-data:
  redis-data:
